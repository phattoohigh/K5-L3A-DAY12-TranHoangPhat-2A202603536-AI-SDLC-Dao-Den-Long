name: CI Verification

on:
  push:
    branches: [ main ]
    tags: [ "phase-*", "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: CP0 smoke check
        run: node tools/cp0/hello-headless.mjs
      - name: Build syntax checks
        run: npm run build
      - name: Unit and CLI tests
        run: npm test
      - name: End-to-end determinism and performance verification
        run: npm run verify
